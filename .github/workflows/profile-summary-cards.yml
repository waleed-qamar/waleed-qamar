# .github/workflows/profile-summary-cards.yml
#
# Generates the stats cards as real SVG files inside this repo, so the README
# never depends on a third-party server being up. Output lands in:
#   profile-summary-card-output/<theme>/{0-profile-details,1-repos-per-language,
#   2-most-commit-language,3-stats,4-productive-time}.svg
#
# Run it once manually (Actions tab -> this workflow -> "Run workflow") right
# after you commit it, otherwise the Activity section will 404 until the first
# scheduled run.

name: Profile Summary Cards

on:
  schedule:
    # 00:30 PKT daily (18:30 UTC the previous day)
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  generate:
    name: Generate cards
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Swap to secrets.PAT if you want private-repo contributions counted.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5 # Pakistan Standard Time
          BRANCH_NAME: main
          AUTO_PUSH: true
