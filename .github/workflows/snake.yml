# .github/workflows/snake.yml
#
# Generates the contribution-graph snake animation and publishes it to a
# dedicated `output` branch, which the README reads from via raw.githubusercontent.
# Nothing is committed to main, so your history stays clean.
#
# Run it once manually after committing (Actions tab -> this workflow ->
# "Run workflow"), then it self-updates daily.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Build SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # %23 is a URL-encoded '#'. Palette matches the hero: Flutter blue on slate.
          outputs: |
            dist/snake.svg?color_snake=%23238BBF&color_dots=%23ebedf0,%23c7e9f8,%2392d4f2,%235bb8e0,%23238BBF
            dist/snake-dark.svg?color_snake=%2354C5F8&color_dots=%230E1116,%231b3a4b,%23246a8a,%233ba0cd,%2354C5F8
          # Plain fallback if you ever want the stock look instead:
          #   dist/snake.svg?palette=github-light
          #   dist/snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
